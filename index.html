<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESTAMON</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<video class="background-video" autoplay muted loop playsinline>

    <source src="videos/minecraft.mp4" type="video/mp4">

</video>

<div class="video-overlay"></div>

<header class="main-header">

    <div class="logo">
        ESTAMON
    </div>


    <div class="header-actions">

        <a href="profile.html" class="profile-icon">
            👤
        </a>


        <button class="menu-toggle" onclick="toggleMenu()">
            ☰
        </button>

    </div>

</header>



<div class="mobile-menu" id="mobileMenu">

    <div class="menu-top">

        <span>
            ESTAMON
        </span>


        <button onclick="toggleMenu()">
            ✕
        </button>

    </div>


    <a href="server-info.html">
        ⚔️ Информация
    </a>


    <a href="forum.html">
        💬 Форум
    </a>


    <a href="news.html">
        📰 Новости
    </a>


    <a href="rules.html">
        📜 Правила
    </a>


    <a href="donate.html">
        💎 Донат
    </a>


    <a href="profile.html">
        👤 Профиль
    </a>


    <a onclick="logout()" style="cursor:pointer;">
        🚪 Выйти
    </a>


</div>



<div class="menu-background" id="menuBackground" onclick="toggleMenu()"></div>


<div class="side-menu" id="sideMenu">

    <div class="menu-header">

        <span>ESTAMON</span>

        <button class="close-btn" onclick="toggleMenu()">
            ✕
        </button>

    </div>

    <a href="server-info.html">⚔ Информация</a>

    <a href="forum.html">💬 Форум</a>

    <a href="news.html">📰 Новости</a>

    <a href="rules.html">📜 Правила</a>

    <a href="donate.html">💎 Донат</a>

    <a href="profile.html">👤 Профиль</a>

</div>


<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

<section class="hero">

    <div class="hero-content">

        <h1>

            Добро пожаловать в

            <span>
                ESTAMON
            </span>

        </h1>

        <p>

            Мир приключений, строительства и новых возможностей

        </p>

        <div class="buttons">

            <button onclick="window.location.href='play.html'">
                Начать играть
            </button>

            <button onclick="window.location.href='forum.html'">
                Форум
            </button>

        </div>

    </div>

</section>

<div class="fog"></div>

<div class="particles"></div>

<script src="auth.js"></script>
<script src="script.js"></script>

<script>

function logout(){

    localStorage.removeItem("estamonUser");
    localStorage.removeItem("user");

    window.location.href="login.html";

}

// ===========================
// Мобильное меню
// ===========================

function toggleMenu(){

    document.querySelector("nav").classList.toggle("active");

}

document.querySelectorAll("nav a").forEach(link=>{

    link.addEventListener("click",()=>{

        document.querySelector("nav").classList.remove("active");

    });

});

document.addEventListener("click",function(e){

    const nav=document.querySelector("nav");
    const btn=document.querySelector(".mobile-menu");

    if(
        nav.classList.contains("active")
        &&
        !nav.contains(e.target)
        &&
        !btn.contains(e.target)
    ){

        nav.classList.remove("active");

    }

});

</script>

<script src="script.js"></script>

</body>
</html>
