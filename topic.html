<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTAMON — Тема</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;900&display=swap" rel="stylesheet">

</head>


<body>


<header>

<div class="logo">
ESTAMON
</div>


<nav>

<a href="index.html">Главная</a>

<a href="forum.html">Форум</a>

<a href="donate.html">Донат</a>

</nav>


<div class="profile-button">

<a href="profile.html">
👤
</a>

</div>

</header>




<div class="topic-container">


<div class="topic-card">



<h1 id="title">
Загрузка...
</h1>



<div class="topic-info">


Автор:

<span id="author"></span>


<span id="author-role" class="role-badge"></span>



<br><br>


Дата:

<span id="date"></span>



</div>





<div class="topic-text" id="text">

</div>





<div id="moderation-panel" 
class="moderation-panel"
style="display:none;">


<button onclick="editTopic()">
✏️ Редактировать
</button>


<button onclick="pinTopic()">
📌 Закрепить
</button>


<button onclick="closeTopic()">
🔒 Закрыть
</button>


<button onclick="deleteTopic()">
🗑 Удалить
</button>



</div>





<h2>
💬 Ответы
</h2>



<div id="answers">

</div>





<div class="answer-box">


<textarea 
id="answerText"
placeholder="Ваш ответ...">
</textarea>



<button onclick="sendAnswer()">

Отправить

</button>



</div>



</div>


</div>

<script>


let params = new URLSearchParams(
window.location.search
);


let topicId = params.get("id");


let topic;


let user = JSON.parse(
localStorage.getItem("user")
);





const staffRoles = [

"Мл.Хелпер",

"Хелпер",

"Ст.Хелпер",

"Мл.Модератор",

"Модератор",

"Ст.Модератор",

"Куратор по рекламе",

"Куратор по команде проекта",

"Зам Куратор",

"Куратор режима",

"Создатель"

];







fetch(
"/api/topics/"+topicId
)


.then(r=>r.json())


.then(data=>{


topic=data;



document.getElementById("title").innerText =
data.title;



document.getElementById("author").innerText =
data.author;



document.getElementById("date").innerText =
data.date;



document.getElementById("text").innerText =
data.text;





// роль автора темы


if(data.role){


let badge =
document.getElementById("author-role");


badge.innerText =
"["+data.role+"]";


badge.className =
"role-badge";


}






let answers =
document.getElementById("answers");


answers.innerHTML="";



data.answers.forEach(a=>{


answers.innerHTML += `


<div class="answer">


<div>


<b>

${a.author}

</b>


<span class="role-badge">

${a.role ? "["+a.role+"]" : ""}

</span>


</div>



<p>

${a.text}

</p>



<small>

${a.date}

</small>



</div>



`;



});





checkModeration();



});









function checkModeration(){


if(!user)
return;



if(
staffRoles.includes(user.role)
){


document.getElementById(
"moderation-panel"
)
.style.display="flex";


}



}









function sendAnswer(){



if(!user){


alert(
"Войдите в аккаунт"
);


return;


}



let text =
document.getElementById(
"answerText"
).value;



if(!text){

alert(
"Введите текст"
);

return;

}





fetch(
"/api/topics/"+topicId+"/answer",
{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


author:user.login,


role:user.role,


text:text


})


})


.then(r=>r.json())


.then(d=>{


alert(
d.message
);


location.reload();


});



}



function pinTopic(){


fetch(
"/api/topics/"+topicId+"/pin",
{


method:"POST",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

author:user.login

})


})


.then(r=>r.json())


.then(data=>{


alert(
data.success
?
"📌 Тема закреплена"
:
data.message
);


location.reload();


});


}







function closeTopic(){


fetch(
"/api/topics/"+topicId+"/close",
{


method:"POST",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

author:user.login

})


})


.then(r=>r.json())


.then(data=>{


alert(
data.success
?
"🔒 Тема закрыта"
:
data.message
);


location.reload();


});


}








function deleteTopic(){


if(
!confirm(
"Удалить тему?"
)

)
return;



fetch(
"/api/topics/"+topicId,
{


method:"DELETE",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

author:user.login

})


})


.then(r=>r.json())


.then(data=>{


alert(
data.message
);



if(data.success){

location.href="forum.html";

}



});


}








function editTopic(){



let newText =
prompt(
"Введите новый текст темы:",
topic.text
);



if(!newText)
return;




fetch(
"/api/topics/"+topicId,
{


method:"PUT",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

text:newText,

author:user.login

})


})


.then(r=>r.json())


.then(data=>{


alert(
data.message
);


location.reload();


});



}



</script>



<script src="permissions.js"></script>

</body>

</html>
