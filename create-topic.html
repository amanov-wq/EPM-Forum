<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTAMON — Создать тему</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700;900&display=swap" rel="stylesheet">


</head>



<body>


<div class="forum-page">



<header>


<div class="logo">
ESTAMON
</div>


<nav>

<a href="index.html">Главная</a>

<a href="forum.html">Форум</a>

<a href="news.html">Новости</a>

<a href="rules.html">Правила</a>

<a href="donate.html">Донат</a>

</nav>



<div class="profile-button">

<a href="profile.html">
👤
</a>

</div>


</header>






<div class="forum-title">


<h1>
Создание темы
</h1>


<p>
Создайте новую тему форума
</p>


</div>








<div class="profile-container">


<div class="profile-card" style="width:600px;">



<h2 id="section-title">

</h2>




<input 
id="title"
placeholder="Название темы"
>




<textarea

id="text"

placeholder="Текст темы"

></textarea>





<button onclick="createTopic()">

Создать тему

</button>



</div>


</div>



</div>










<script>



const user = JSON.parse(
localStorage.getItem("user")
);





const staffRoles = [


"Мл.Хелпер",

"Хелпер",

"Ст.Хелпер",

"Мл.Модератор",

"Модератор",

"Ст.Модератор",

"Куратор по рекламе",

"Куратор по команде проекта",

"Зам Куратор",

"Куратор режима",

"Создатель"

];






const allowedSections = [


"Общение",

"Жалобы",

"Баг-репорты",

"Отзывы"

];







let params = new URLSearchParams(
window.location.search
);



let section =
params.get("section");





document.getElementById(
"section-title"
).innerHTML =

"Раздел: " + (section || "Общее");









if(!user){


alert("Войдите в аккаунт");


location.href="login.html";


}







function createTopic(){



let title =
document.getElementById("title").value;



let text =
document.getElementById("text").value;





if(title.length < 3 || text.length < 3){


alert("Заполните все поля");


return;


}








if(

!staffRoles.includes(user.role)

&&

!allowedSections.includes(section)

){


alert(
"У вас нет прав создавать темы в этом разделе"
);


return;


}








fetch("/api/topics",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


title:title,


text:text,


author:user.login,


role:user.role,


section:section


})


})



.then(r=>r.json())



.then(data=>{


if(data.success){


alert("✅ Тема создана");


location.href="forum.html";


}

else{


alert(
data.message || "Ошибка создания темы"
);


}


});




}



</script>

<script src="script.js"></script>

</body>

</html>
