<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTAMON — Вход</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;900&display=swap" rel="stylesheet">

</head>



<body>



<div class="login-page">



<header class="header">

    <div class="logo">
        ESTAMON
    </div>

    <div class="header-right">

        <a href="profile.html" class="profile-btn">
            👤
        </a>

        <button class="menu-btn" onclick="toggleMenu()">
            ☰
        </button>

    </div>

</header>


<div class="side-menu" id="sideMenu">

    <div class="menu-header">

        <span>ESTAMON</span>

        <button class="close-btn" onclick="toggleMenu()">
            ✕
        </button>

    </div>

    <a href="server-info.html">⚔ Информация</a>

    <a href="forum.html">💬 Форум</a>

    <a href="news.html">📰 Новости</a>

    <a href="rules.html">📜 Правила</a>

    <a href="donate.html">💎 Донат</a>

    <a href="profile.html">👤 Профиль</a>

</div>


<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>







<div class="login-box">



<h1>

Вход

</h1>





<input

id="login"

type="text"

placeholder="Логин"

>






<input

id="password"

type="password"

placeholder="Пароль"

>







<button onclick="login()">

Войти

</button>








<div class="login-link">


Нет аккаунта?


<a href="register.html">

Регистрация

</a>


</div>




</div>





</div>








<script>



function login(){



let loginValue =

document.getElementById("login").value;



let passwordValue =

document.getElementById("password").value;





if(!loginValue || !passwordValue){


alert("Заполните все поля");


return;


}






fetch("/login",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


login:loginValue,


password:passwordValue


})


})





.then(res=>res.json())



.then(data=>{



if(data.success){





// единый ключ аккаунта

localStorage.setItem(

"user",

JSON.stringify(data.user)

);



// удаляем старый ключ

localStorage.removeItem("estamonUser");






alert("Добро пожаловать в ESTAMON!");



location.href="profile.html";





}else{



alert(data.message || "Неверный логин или пароль");



}



})



.catch(error=>{



console.log(error);



alert("Ошибка соединения с сервером");



});



}







function toggleMenu(){


document.querySelector("nav")

.classList.toggle("active");


}





</script>


<script>

function toggleMenu(){

    document.querySelector("nav").classList.toggle("active");

}

</script>

<script src="script.js"></script>

</body>

</html>
