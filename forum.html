<script>

const user = JSON.parse(localStorage.getItem("user"));

const staffRoles = [
"Мл.Хелпер",
"Хелпер",
"Ст.Хелпер",
"Мл.Модератор",
"Модератор",
"Ст.Модератор",
"Куратор по рекламе",
"Куратор по команде проекта",
"Зам Куратор",
"Куратор режима",
"Создатель"
];

const userSections = [
"Общение",
"Жалобы",
"Баг-репорты",
"Отзывы"
];

document.querySelectorAll(".section-link").forEach(link=>{

const href = link.getAttribute("href");

if(href==="admin.html"){

if(!user || !staffRoles.includes(user.role)){
link.parentElement.style.display="none";
}

return;

}

if(!user)return;

if(staffRoles.includes(user.role))return;

const name = new URLSearchParams(href.split("?")[1]).get("name");

if(!userSections.includes(name)){

link.parentElement.style.opacity="0.45";
link.style.pointerEvents="none";

link.innerHTML += `
<br>
<span style="
color:#ff5555;
font-size:15px;
font-weight:700;
">
🔒 Только для персонала
</span>
`;

}

});

</script>
