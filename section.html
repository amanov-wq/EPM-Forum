<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTAMON — Раздел</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;900&display=swap" rel="stylesheet">

</head>


<body class="forum-page">


<header class="main-header">

<div class="logo">
ESTAMON
</div>


<div class="header-actions">

<a href="profile.html" class="profile-icon">
👤
</a>


<button class="menu-toggle" onclick="toggleMenu()">
☰
</button>

</div>

</header>



<div class="forum-wrapper">


<div class="forum-title">

<h1 id="sectionName">
Раздел
</h1>


<a id="createBtn" href="create-topic.html" class="create-topic">
Создать тему
</a>


</div>



<div id="topicsList" class="topics-list">


<div class="forum-box">
Загрузка тем...
</div>


</div>



</div>





<script>


const params = new URLSearchParams(location.search);

const section = params.get("name");


document.getElementById("sectionName").innerHTML =
"💬 " + section;



const topicsList =
document.getElementById("topicsList");



async function loadTopics(){


try{


let res = await fetch("/api/topics");


let topics = await res.json();



let filtered = topics.filter(t=>t.section===section);



if(filtered.length===0){


topicsList.innerHTML = `

<div class="forum-box">

<h2>
Тем пока нет
</h2>

<p>
Создайте первую тему!
</p>

</div>

`;

return;

}



topicsList.innerHTML="";



filtered.reverse().forEach(topic=>{


let box=document.createElement("div");


box.className="forum-box";



box.innerHTML=`

<h2>

${topic.pinned ? "📌 " : ""}

${topic.title}

</h2>


<p>

👤 Автор:
${topic.author || "Игрок"}

</p>


<p>

💬 Ответов:
${topic.answers ? topic.answers.length : 0}

</p>


<a class="create-topic"

href="topic.html?id=${topic.id}">

Открыть тему

</a>


`;



topicsList.appendChild(box);



});



}catch(e){


topicsList.innerHTML=

`
<div class="forum-box">

Ошибка загрузки тем

</div>
`;

}


}



loadTopics();





function toggleMenu(){

document.querySelector("nav")
.classList.toggle("active");

}



</script>



<script src="script.js"></script>


</body>
</html>
