<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTAMON — Админ панель</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">

<h1>ESTAMON ADMIN</h1>

<a href="index.html">
Главная
</a>

</header>



<div class="admin-wrapper">


<h2>🛡 Админ панель</h2>



<div id="adminStatus">
Проверка прав...
</div>



<section class="admin-box">


<h3>👥 Пользователи</h3>


<table>


<thead>

<tr>

<th>Логин</th>

<th>Email</th>

<th>Роль</th>

<th>Изменить</th>

</tr>

</thead>


<tbody id="usersList">

</tbody>


</table>


</section>





<section class="admin-box">


<h3>💰 Покупки доната</h3>


<div id="purchasesList">

</div>


</section>



</div>





<script>


let login =
localStorage.getItem("login");



if(!login){

document.getElementById("adminStatus").innerHTML =
"❌ Вы не вошли";

}




async function checkAdmin(){


let res =
await fetch(
"/check-admin/"+login
);


let data =
await res.json();



if(!data.allowed){


document.getElementById("adminStatus").innerHTML =
"❌ Нет доступа";


return;


}


document.getElementById("adminStatus").innerHTML =
"✅ Доступ разрешён";


loadUsers();

loadPurchases();


}






async function loadUsers(){


let res =
await fetch(
"/admin/users"
);


let users =
await res.json();



let html="";



users.forEach(user=>{


html += `

<tr>

<td>${user.login}</td>

<td>${user.email}</td>


<td>

<select id="role-${user.login}">


<option ${user.role=="Пользователь"?"selected":""}>
Пользователь
</option>


<option ${user.role=="Стример"?"selected":""}>
Стример
</option>


<option ${user.role=="Мл.Хелпер"?"selected":""}>
Мл.Хелпер
</option>


<option ${user.role=="Хелпер"?"selected":""}>
Хелпер
</option>


<option ${user.role=="Модератор"?"selected":""}>
Модератор
</option>


<option ${user.role=="Куратор режима"?"selected":""}>
Куратор режима
</option>


<option ${user.role=="Создатель"?"selected":""}>
Создатель
</option>


</select>


</td>



<td>


<button onclick="changeRole('${user.login}')">

Сохранить

</button>


</td>


</tr>


`;


});



document.getElementById("usersList").innerHTML =
html;


}







async function changeRole(user){


let role =
document.getElementById(
"role-"+user
).value;



await fetch(
"/admin/role",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

login:user,

role:role

})


});


alert(
"Роль изменена"
);


loadUsers();


}









async function loadPurchases(){


let res =
await fetch(
"/admin/purchases"
);


let data =
await res.json();



let html="";



data.forEach(p=>{


html += `

<div class="purchase-card">


<b>${p.nickname}</b>

<br>

${p.product}

<br>

Цена: ${p.price}₽

<br>

Статус:
${p.status}


</div>

`;


});



document.getElementById(
"purchasesList"
).innerHTML =
html;


}





checkAdmin();


</script>



</body>

</html>
