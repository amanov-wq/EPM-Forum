<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTAMON — Админ панель</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;900&display=swap" rel="stylesheet">

</head>


<body>


<div class="admin-page">


<header class="main-header">

<div class="logo">
ESTAMON ADMIN
</div>


<div class="header-actions">

<a href="profile.html" class="profile-icon">
👤
</a>


</div>

</header>





<div class="admin-wrapper">


<h1>
🛡 Админ панель
</h1>


<div id="adminStatus" class="admin-status">

Проверка прав...

</div>





<div class="admin-box">


<h2>
👥 Пользователи
</h2>



<input 
id="searchUser"
placeholder="Поиск игрока..."
oninput="searchUsers()"
>



<div id="usersList">

</div>



</div>







<div class="admin-box">


<h2>
💰 Покупки доната
</h2>


<div id="purchasesList">

</div>


</div>





</div>


</div>






<script>


let currentUser =
JSON.parse(
localStorage.getItem("user")
);



let usersData=[];





// проверка доступа


if(!currentUser){


location.href="login.html";


}



fetch(
"/check-admin/"+currentUser.login
)


.then(res=>res.json())


.then(data=>{


if(!data.allowed){


document.body.innerHTML = `

<h1 style="text-align:center;margin-top:100px">

❌ Нет доступа

</h1>

`;


return;


}



document.getElementById(
"adminStatus"
).innerHTML =
"✅ Доступ разрешён";


loadUsers();

loadPurchases();


});







// загрузка пользователей


function loadUsers(){


fetch("/admin/users")


.then(res=>res.json())


.then(data=>{


usersData=data;


renderUsers(data);


});


}







function renderUsers(users){


let html="";



users.forEach(user=>{


html += `


<div class="user-card">


<div>


<h3>
${user.login}
</h3>


<p>
📧 ${user.email}
</p>


<p>
Роль:
<b>${user.role}</b>
</p>


</div>




<select id="role-${user.login}">


<option ${user.role=="Пользователь"?"selected":""}>
Пользователь
</option>


<option ${user.role=="Стример"?"selected":""}>
Стример
</option>


<option ${user.role=="Стажер"?"selected":""}>
Стажер
</option>


<option ${user.role=="Мл.Хелпер"?"selected":""}>
Мл.Хелпер
</option>


<option ${user.role=="Хелпер"?"selected":""}>
Хелпер
</option>


<option ${user.role=="Модератор"?"selected":""}>
Модератор
</option>


<option ${user.role=="Ст.Модератор"?"selected":""}>
Ст.Модератор
</option>


<option ${user.role=="Куратор режима"?"selected":""}>
Куратор режима
</option>


<option ${user.role=="Создатель"?"selected":""}>
Создатель
</option>


</select>



<button onclick="changeRole('${user.login}')">

Сохранить

</button>



</div>


`;


});



document.getElementById(
"usersList"
).innerHTML=html;


}







function searchUsers(){


let text =
document.getElementById(
"searchUser"
).value.toLowerCase();



let result =
usersData.filter(u=>

u.login.toLowerCase()
.includes(text)

);



renderUsers(result);


}







// изменение роли


function changeRole(login){


let role =
document.getElementById(
"role-"+login
).value;



fetch("/admin/role",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


login:login,

role:role


})


})


.then(res=>res.json())


.then(data=>{


alert(
"Роль изменена"
);


loadUsers();


});


}







// покупки


function loadPurchases(){


fetch("/admin/purchases")


.then(res=>res.json())


.then(data=>{


let html="";



data.forEach(p=>{


html += `


<div class="purchase-card">


<h3>
${p.nickname}
</h3>


<p>
💎 ${p.product}
</p>


<p>
Цена: ${p.price}₽
</p>


<p>
Статус: ${p.status}
</p>


</div>


`;


});



document.getElementById(
"purchasesList"
).innerHTML=html;


});


}



</script>


</body>

</html>
