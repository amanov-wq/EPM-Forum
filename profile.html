<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPM Profile</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">

<div class="logo">
EPM
</div>


<nav>

<a href="index.html">Главная</a>
<a href="forum.html">Форум</a>
<a href="news.html">Новости</a>
<a href="rules.html">Правила</a>
<a href="donate.html">Донат</a>

</nav>

</header>



<main class="profile-wrapper">



<section id="userProfile">



<div class="profile-card">



<!-- АВАТАР -->


<div class="avatar-box">

<img 
id="userAvatar"
src="images/default-avatar.png">

</div>





<h1 id="profileNickname">

Amanov

</h1>




<div id="profileRole" class="role-button">

Создатель

</div>






<!-- СТАТИСТИКА -->


<div class="profile-stats">



<div class="stat">

<span>

Уровень

</span>


<b id="userLevel">

25

</b>


</div>




<div class="stat">


<span>

Сообщения

</span>


<b id="messageCount">

125

</b>


</div>





<div class="stat">


<span>

Дата регистрации

</span>


<b id="registerDate">

2026

</b>


</div>



</div>







<!-- АВАТАР СМЕНА -->


<div class="avatar-change">


<input 
id="avatarInput"
placeholder="Ссылка на аватар">



<button>

Сменить аватар

</button>


</div>








<!-- BATTLE PASS -->


<div class="battlepass">



<h2>

🎟 Battle Pass

</h2>




<div class="bp-level">

Уровень:

<strong>

12

</strong>


</div>




<div class="bp-bar">


<div class="bp-progress">

</div>


</div>



<p>

1200 / 2000 XP

</p>



</div>







<!-- КНОПКИ -->


<div class="profile-buttons">



<a href="forum.html">

Форум

</a>



<button onclick="logout()">

Выйти

</button>



</div>




</div>


</section>



</main>




<script src="profile.js"></script>


</body>

</html>
