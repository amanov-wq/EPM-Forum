<h1>
💎 Покупка доната
</h1>



<h2 id="productName">

Загрузка...

</h2>


<h2 id="productPrice">

</h2>




<input 
id="nickname"
placeholder="Введите никнейм Minecraft"
>



<input 
id="email"
placeholder="Введите почту"
>



<input 
id="coupon"
placeholder="Укажите купон, если есть"
>




<select id="payment">


<option>
СБП
</option>


<option>
Российские карты
</option>


<option>
Зарубежные карты
</option>


<option>
USDT, LTC и прочее
</option>


</select>





<label class="agree">


<input type="checkbox" id="agree">

Я принимаю условия пользовательского соглашения


</label>





<button onclick="buy()">

Приобрести

</button>



</div>





<script>


let params = new URLSearchParams(
window.location.search
);



let product =
params.get("product");


let price =
params.get("price");



document.getElementById("productName").innerHTML =
product;



document.getElementById("productPrice").innerHTML =
"Итого: " + price + "₽";







function buy(){



let nickname =
document.getElementById("nickname").value;



let email =
document.getElementById("email").value;



let coupon =
document.getElementById("coupon").value;



let payment =
document.getElementById("payment").value;



let agree =
document.getElementById("agree").checked;




if(!nickname || !email){

alert("Заполните ник и почту");

return;

}



if(!agree){

alert("Примите условия");

return;

}





fetch("/donate/create-payment",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


nickname:nickname,

email:email,

coupon:coupon,

product:product,

price:price,

payment:payment


})


})


.then(r=>r.json())


.then(data=>{


alert(
"Заказ создан! Сейчас будет переход к оплате."
);



console.log(data);



});



}



</script>

<script>

const params = new URLSearchParams(window.location.search);


const donateName = params.get("name");
const donatePrice = params.get("price");



document.getElementById("donate-name").textContent =
donateName || "Донат";



document.getElementById("donate-price").textContent =
donatePrice ? donatePrice + " ₽" : "0 ₽";



</script>
